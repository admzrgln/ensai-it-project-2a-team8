[project]
name = "ensai-cinema-club"
version = "0.1.0"
description = "Ensai Cinema Club - backend for cinema ticketing and accounting (ENSAI 2A IT project, team 8)"
authors = [
    {name = "Thomas Etienne"},
    {name = "Louise Ferron"},
    {name = "Adam Zarg-Layoun"},
    {name = "Alexandre Zarpas"},
]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "pydantic>=2.13.5",
    "PyJWT>=2.13.0",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.2.3",
    "PyYAML>=6.0.3",
    "requests>=2.34.2",
]
requires-python = "==3.14.*"
readme = "README.md"
license = {text = "MIT"}


[tool.ruff]
line-length = 120
# Onyxia runs Python 3.13: don't use syntax that only exists in Python 3.14
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "A", "C90", "PERF", "TCH", "TID"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic reads the annotations of its models at runtime: their imports must stay real imports
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
# FastAPI also reads the annotations of the routes at runtime (dependencies such as AdminPayload,
# bodies, responses): in the controllers, moving these imports into a TYPE_CHECKING block breaks the API
"backend/src/Controller/*" = ["TC001", "TC002", "TC003"]

[tool.pyrefly]
project-includes = ["backend/src/**/*"]
project-excludes = ['.venv/**/*']
search_path = [
    "."
]

[tool.pdm]
distribution = false


[tool.pdm.scripts]
lint = "ruff check"
format = "ruff format"
test = "pytest --cov=backend/src --cov-report=term-missing"
start = "pdm run __main__.py"
typecheck = "pyrefly check"

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "freezegun>=1.5.5",
    "httpx2>=2.16.0",
]
lint = [
    "ruff>=0.16.6",
]
typing = [
    "types-requests>=2.33.0.20260712",
    "types-psycopg2>=2.9.21.20260724",
    "pyrefly>=1.2.0",
    "mypy>=2.4.1",
    "types-PyYAML>=6.0.12.20261122",
]

[tool.pytest.ini_options]
addopts = "-ra -q"
pythonpath = ["."]
testpaths = ["backend/tests"]